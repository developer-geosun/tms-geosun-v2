## Базовий стек для стандартного запуску застосунку
services:
  # Локальний SMTP-сервер для тестування відправки листів
  mailhog:
    image: mailhog/mailhog:latest
    container_name: tms-mailhog
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # База даних для backend-сервісу авторизації
  mysql:
    image: mysql:8.0
    container_name: tms-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tms_auth}
      MYSQL_USER: ${MYSQL_USER:-tms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-tms_user}", "-p${MYSQL_PASSWORD:-tms_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO (S3-сумісне сховище) — опційно для APP_STORAGE_TYPE=s3
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: tms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Створення bucket для MinIO (одноразово при старті)
  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    container_name: tms-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/$${APP_STORAGE_S3_BUCKET:-tms-uploads};
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-tms-uploads}

  # Spring Boot API (auth/backend)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tms-backend
    depends_on:
      mailhog:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tms_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${MYSQL_USER:-tms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tms_password}
      JWT_SECRET: ${JWT_SECRET:-replace-me-with-strong-secret-of-at-least-32-characters}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-900}
      JWT_REFRESH_EXPIRES_SECONDS: ${JWT_REFRESH_EXPIRES_SECONDS:-604800}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      EMAIL_VERIFICATION_EXPIRES_SECONDS: ${EMAIL_VERIFICATION_EXPIRES_SECONDS:-86400}
      EMAIL_VERIFICATION_LINK_BASE: ${EMAIL_VERIFICATION_LINK_BASE:-http://localhost:4200/verify-email}
      PASSWORD_RESET_EXPIRES_SECONDS: ${PASSWORD_RESET_EXPIRES_SECONDS:-3600}
      PASSWORD_RESET_LINK_BASE: ${PASSWORD_RESET_LINK_BASE:-http://localhost:4200/reset-password}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@example.com}
      RATE_LIMIT_LOGIN_MAX_ATTEMPTS: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:-5}
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      RATE_LIMIT_RESEND_VERIFICATION_SECONDS: ${RATE_LIMIT_RESEND_VERIFICATION_SECONDS:-60}
      RATE_LIMIT_FORGOT_PASSWORD_SECONDS: ${RATE_LIMIT_FORGOT_PASSWORD_SECONDS:-60}
      RATE_LIMIT_REFRESH_MAX_REQUESTS: ${RATE_LIMIT_REFRESH_MAX_REQUESTS:-30}
      RATE_LIMIT_REFRESH_WINDOW_SECONDS: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:-60}
      TOKEN_CLEANUP_RETENTION_DAYS: ${TOKEN_CLEANUP_RETENTION_DAYS:-30}
      HERE_API_KEY: ${HERE_API_KEY:-}
      COUNTRY_BREAKDOWN_PROVIDER: ${COUNTRY_BREAKDOWN_PROVIDER:-here}
      PUBLIC_ACCESS_MODE: ${PUBLIC_ACCESS_MODE:-static-ip}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_LOCAL_BASE_PATH: ${APP_STORAGE_LOCAL_BASE_PATH:-/data/uploads}
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-http://minio:9000}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-tms-uploads}
      APP_STORAGE_S3_ACCESS_KEY: ${APP_STORAGE_S3_ACCESS_KEY:-minioadmin}
      APP_STORAGE_S3_SECRET_KEY: ${APP_STORAGE_S3_SECRET_KEY:-minioadmin}
      APP_STORAGE_S3_PATH_STYLE: ${APP_STORAGE_S3_PATH_STYLE:-true}
    volumes:
      - backend_uploads:/data/uploads
    ports:
      - "${SERVER_PORT:-8080}:8080"

  # Production-збірка frontend, що віддається через nginx у контейнері
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_BUILD_CONFIGURATION: ${FRONTEND_BUILD_CONFIGURATION:-production}
    container_name: tms-frontend-app
    depends_on:
      - backend
    environment:
      HERE_API_KEY: ${HERE_API_KEY:-}
    ports:
      - "${FRONTEND_PORT:-4200}:80"

  # Єдина точка входу (reverse proxy) для backend і frontend
  gateway:
    image: nginx:1.27-alpine
    container_name: tms-gateway
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${GATEWAY_PORT:-8081}:80"

  # Публічний тунель лише для backend API (режим PUBLIC_ACCESS_MODE=ngrok).
  # Увімкнення: COMPOSE_PROFILES=ngrok у .env або --profile ngrok.
  # Режим static-ip: без профілю ngrok; порт SERVER_PORT вже опублікований на хості.
  ngrok:
    profiles:
      - ngrok
    image: ngrok/ngrok:latest
    container_name: tms-ngrok
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http --url=${NGROK_DOMAIN} backend:8080
    ports:
      - "${NGROK_INSPECT_PORT:-4040}:4040"

volumes:
  # Персистентне сховище даних MySQL
  mysql_data:
  backend_uploads:
  minio_data:
